# Server Port
server.port=8081

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/logmetric}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgrespassword}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# RabbitMQ Configuration
spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:amqp://guest:guest@localhost:5672}

# Elasticsearch Configuration
spring.elasticsearch.uris=${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}

# JWT_SECRET is used as raw UTF-8 bytes (not Base64) for HS256 signing -- must be >=32 bytes.
# The app refuses to start if it's shorter. Set a strong random value in every real environment.
jwt.secret=${JWT_SECRET:thisIsADefaultSecretKeyThatIsAtLeast32BytesLongForHS256}
jwt.expiration=${JWT_EXPIRATION:86400000}