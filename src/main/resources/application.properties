# Server Port
server.port=8080

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/logmetric}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgrespassword}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# RabbitMQ Configuration
spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:amqp://guest:guest@localhost:5672}

# Elasticsearch Configuration
spring.elasticsearch.uris=${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
# JWT Configuration
# Secret key used for HS256 signing - must be at least 256 bits (32 characters)
jwt.secret=8f42a7c1b3e9d5f8a2c6e0b4d7f1a3c5e9b2d6f0a4c8e1b5d9f3a7c0e4b8d2f6
jwt.expiration=86400000