# Server Port
server.port=8081

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/logmetric}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgrespassword}
spring.jpa.hibernate.ddl-auto=update
# S5 (SECURITY-TODO.md): defaults off -- every query logged is real throughput/log-volume
# cost in production. Set SPRING_JPA_SHOW_SQL=true locally if you want the query log back.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# RabbitMQ Configuration
spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:amqp://guest:guest@localhost:5672}

# Elasticsearch Configuration
spring.elasticsearch.uris=${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
spring.elasticsearch.username=${SPRING_ELASTICSEARCH_USERNAME:}
spring.elasticsearch.password=${SPRING_ELASTICSEARCH_PASSWORD:}

# JWT_SECRET is used as raw UTF-8 bytes (not Base64) for HS256 signing -- must be >=32 bytes.
# The app refuses to start if it's shorter. Set a strong random value in every real environment.
jwt.secret=${JWT_SECRET:thisIsADefaultSecretKeyThatIsAtLeast32BytesLongForHS256}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Surface ResponseStatusException reason text (e.g. "Email is already registered") to clients.
# Every such reason in this codebase is a deliberately client-safe message -- stack traces
# remain hidden (server.error.include-stacktrace stays at its default of "never").
server.error.include-message=always

# Mail (SMTP) -- defaults point at the local MailHog catcher started by
# docker-compose (inspect what was "sent" at http://localhost:8025). No auth/TLS
# needed for MailHog. Point these at a real provider via env vars in production.
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:false}
mail.from=${MAIL_FROM:noreply@logmetric.local}

# Minimum time between deliveries of the same alert rule, so a sustained
# incident pages its recipients once, not on every 60s scheduler tick.
alert.cooldown-seconds=${ALERT_COOLDOWN_SECONDS:900}
# Caffeine Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=15s

# Increase scheduled task thread pool so the 5-min flush doesn't block the 60-second alert evaluator
spring.task.scheduling.pool.size=2
