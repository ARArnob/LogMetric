#spring.application.name=LogMetric-API
# PostgreSQL Connection
#spring.datasource.url=jdbc:postgresql://localhost:5432/logmetric
#spring.datasource.password=postgres

# Hibernate (ORM) Settings
# 'update' tells Spring to automatically build your SQL tables based on your Java classes
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.application.name=LogMetric-API

# =====================================================================
# 1. Managed Cloud PostgreSQL (Neon Singapore Edge)
# =====================================================================
spring.datasource.url=${NEON_DB_URL}
spring.datasource.username=${NEON_DB_USER}
spring.datasource.password=${NEON_DB_PASSWORD}

# Hibernate (ORM) Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# =====================================================================
# 2. Managed Cloud RabbitMQ Broker (CloudAMQP Cluster)
# =====================================================================
spring.rabbitmq.addresses=${SPRING_RABBITMQ_URI}